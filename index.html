<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->
    <meta
      property="og:title"
      content="Frontend Mentor | Results Summary Component"
    />

    <meta
      property="og:image"
      content="https://raw.githubusercontent.com/Godson142/results-summary-component/main/assets/screenshots/desktop.png"
    />
    <meta
      property="og:description"
      content="A results summary component showing scores across four categories."
    />
    <meta
      property="og:url"
      content="https://godson142.github.io/results-summary-component/"
    />
    <meta property="og:type" content="website" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="./styles.css" />

    <title>Frontend Mentor | Results Summary Component</title>
  </head>

  <body>
    <main class="main-content">
      <div class="card-one">
        <h1 class="small-texts">Your Result</h1>

        <div class="score">
          <span class="big-texts result"> 76 </span>
          <span class="small-texts">of 100</span>
        </div>

        <span class="big-texts" style="font-size: 25px; font-weight: 700"
          >Great</span
        >
        <p class="small-texts" style="text-align: center; margin-top: -10px">
          You scored higher than 65% of the people who have taken these tests.
        </p>
      </div>

      <div class="card-two">
        <h1>Summary</h1>
        <div class="reaction">
          <img src="./assets/images/icon-reaction.svg" alt="" />
          <span class="sum-descr react">Reaction</span>
          <span class="sum-score">
            <span class="actual-score">80</span>
            <span class="overall"> / 100</span>
          </span>
        </div>

        <div class="memory">
          <img src="./assets/images/icon-memory.svg" alt="" />
          <span class="sum-descr mem">Memory</span>
          <span class="sum-score">
            <span class="actual-score">92</span>
            <span class="overall"> / 100 </span>
          </span>
        </div>

        <div class="verbal">
          <img src="./assets/images/icon-verbal.svg" alt="" />
          <span class="sum-descr verb">Verbal</span>
          <span class="sum-score">
            <span class="actual-score">61</span>
            <span class="overall"> / 100</span>
          </span>
        </div>

        <div class="visual">
          <img src="./assets/images/icon-visual.svg" alt="" />
          <span class="sum-descr vis">Visual</span>
          <span class="sum-score">
            <span class="actual-score">73</span>
            <span class="overall">/ 100</span>
          </span>
        </div>

        <button type="button">Continue</button>
      </div>
    </main>
    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by
      <a href="https://www.frontendmentor.io/profile/Godson142" target="_blank"
        >Godson142</a
      >.
    </footer>
  </body>
</html>
